name: fahis_inspector
description: "Fahis App for Inspection Centers"
publish_to: 'none'
version: 2.0.1+9

environment:
  sdk: ^3.9.0

#-------------------- PACKAGES --------------------#

dependencies:
  flutter:
    sdk: flutter

  # Utility Packages

  cupertino_icons: ^1.0.6
  intl: ^0.20.2
  flutter_slidable: ^4.0.1
  sms_autofill: ^2.4.1
  timer_count_down: ^2.2.2
  flutter_native_splash: ^2.4.6
  iconsax: ^0.0.8
  easy_image_viewer: ^1.5.1
  image_picker: ^1.2.0
  flutter_svg: ^2.2.0
  http_parser: ^4.1.2
  share_plus: ^11.1.0
  mime: ^2.0.0
  flutter_side_menu: ^0.5.41
  badges: ^3.1.2
  file_picker: ^10.3.2
  smooth_page_indicator: ^1.2.1
  web_socket_channel: ^3.0.3
  http: ^1.5.0
  hive_flutter: ^1.1.0
  shared_preferences: ^2.5.3
  connectivity_plus: ^6.1.5
  url_launcher: ^6.3.2
  get: ^4.7.2
  camera: ^0.11.2
  lottie: ^3.3.2
  firebase_core: ^4.2.1
  firebase_messaging: ^16.0.2
  firebase_analytics: ^12.0.4
  flutter_local_notifications: ^19.4.2

  paint_gauge:
    # When depending on this package from a real application you should use:
    #   paint_gauge: ^x.y.z
    # See https://dart.dev/tools/pub/dependencies#version-constraints
    # The example app is bundled with the plugin so we use a path dependency on
    # the parent directory to use the current plugin's version.
    path: packages/paint_gauge/
  permission_handler: ^11.0.1

flutter_native_splash:
  color: "#ffffff"
  image: assets/images/logos/fahis_logo.png
  android: true
  ios: true

  android_12:
    image: assets/images/logos/fahis_logo.png
    icon_background_color: "#ffffff"


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/logos/fahis_icon.png"

flutter:
  uses-material-design: true

  #-------------------- LOCAL ASSETS --------------------#
  assets:
    - assets/images/logos/
    - assets/images/on_boarding_images/
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/images/inspection_body_note_details/Interior/

  #-------------------- LOCAL FONTS --------------------#
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Black.ttf
        - asset: assets/fonts/Tajawal-Bold.ttf
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
        - asset: assets/fonts/Tajawal-ExtraLight.ttf
        - asset: assets/fonts/Tajawal-Light.ttf
        - asset: assets/fonts/Tajawal-Medium.ttf
        - asset: assets/fonts/Tajawal-Regular.ttf
