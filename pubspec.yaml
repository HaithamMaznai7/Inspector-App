name: fahis_inspector
description: "Fahis App for Inspection Centers"
publish_to: "none"
version: 2.0.1+20

environment:
  sdk: ^3.9.0

#-------------------- PACKAGES --------------------#
dependencies:
  cached_network_image: ^3.4.1
  camera: ^0.12.0+1
  cloud_firestore: ^6.2.0
  connectivity_plus: ^6.1.5
  cupertino_icons: ^1.0.6
  easy_image_viewer: ^1.5.1
  file_picker: ^10.3.2
  firebase_analytics: ^12.0.4
  firebase_auth: ^6.1.3
  firebase_core: ^4.2.1
  firebase_messaging: ^16.0.2
  firebase_remote_config: ^6.1.4
  flutter:
    sdk: flutter
  flutter_image_compress: ^2.4.0
  flutter_native_splash: ^2.4.6
  flutter_secure_storage: ^10.0.0
  flutter_side_menu: ^0.5.41
  flutter_slidable: ^4.0.1
  flutter_svg: ^2.2.3
  freezed: ^3.2.5
  freezed_annotation: ^3.1.0
  get: ^4.7.2
  get_it: ^9.2.0
  hive_flutter: ^1.1.0
  iconsax: ^0.0.8
  image_picker: ^1.1.2
  intl: ^0.20.2
  json_annotation: ^4.10.0
  json_serializable: ^6.12.0
  lottie: ^3.3.2
  package_info_plus: ^8.3.0
  pinput: ^6.0.2
  rename: ^3.1.0
  sentry_flutter: ^9.15.0
  share_plus: ^11.1.0
  shimmer: ^3.0.0
  smart_auth: ^3.2.0
  smooth_page_indicator: ^1.2.1
  url_launcher: ^6.3.2

dev_dependencies:
  build_runner: ^2.11.0
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  #-------------------- LOCAL ASSETS --------------------#
  assets:
    - assets/images/logos/
    - assets/images/on_boarding_images/
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/images/inspection_body_note_details/Interior/
    - shorebird.yaml

  #-------------------- LOCAL FONTS --------------------#
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Black.ttf
        - asset: assets/fonts/Tajawal-Bold.ttf
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
        - asset: assets/fonts/Tajawal-ExtraLight.ttf
        - asset: assets/fonts/Tajawal-Light.ttf
        - asset: assets/fonts/Tajawal-Medium.ttf
        - asset: assets/fonts/Tajawal-Regular.ttf
