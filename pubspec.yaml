name: fahis_inspector
description: "Fahis App for Inspection Centers"
publish_to: "none"
version: 2.0.1+9

environment:
  sdk: ^3.9.0

#-------------------- PACKAGES --------------------#
dependencies:
  camera: ^0.11.2
  connectivity_plus: ^6.1.5
  cupertino_icons: ^1.0.6
  dio: ^5.9.1
  easy_image_viewer: ^1.5.1
  file_picker: ^10.3.2
  firebase_analytics: ^12.0.4
  firebase_auth: ^6.1.3
  firebase_core: ^4.2.1
  firebase_messaging: ^16.0.2
  firebase_remote_config: ^6.1.4
  package_info_plus: ^8.3.0
  flutter:
    sdk: flutter
  flutter_native_splash: ^2.4.6
  flutter_secure_storage: ^10.0.0
  flutter_side_menu: ^0.5.41
  flutter_slidable: ^4.0.1
  flutter_svg: ^2.2.3
  freezed: ^3.2.5
  freezed_annotation: ^3.1.0
  get: ^4.7.2
  get_it: ^9.2.0
  hive_flutter: ^1.1.0
  iconsax: ^0.0.8
  image_picker: ^1.1.2
  intl: ^0.20.2
  json_annotation: ^4.10.0
  json_serializable: ^6.12.0
  lottie: ^3.3.2
  permission_handler: ^11.0.1
  pretty_dio_logger: ^1.4.0
  rename: ^3.1.0
  retrofit: ^4.9.2
  retrofit_generator: ^10.2.1
  share_plus: ^11.1.0
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.2.1
  sms_autofill: ^2.4.1
  timer_count_down: ^2.2.2
  url_launcher: ^6.3.2
  web_socket_channel: ^3.0.3

flutter_native_splash:
  color: "#ffffff"
  image: assets/images/logos/fahis_logo.png
  android: true
  ios: true

  android_12:
    image: assets/images/logos/fahis_logo.png
    icon_background_color: "#ffffff"

dev_dependencies:
  build_runner: ^2.11.0
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  #-------------------- LOCAL ASSETS --------------------#
  assets:
    - assets/images/logos/
    - assets/images/on_boarding_images/
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/images/inspection_body_note_details/Interior/
    - shorebird.yaml

  #-------------------- LOCAL FONTS --------------------#
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Black.ttf
        - asset: assets/fonts/Tajawal-Bold.ttf
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
        - asset: assets/fonts/Tajawal-ExtraLight.ttf
        - asset: assets/fonts/Tajawal-Light.ttf
        - asset: assets/fonts/Tajawal-Medium.ttf
        - asset: assets/fonts/Tajawal-Regular.ttf
