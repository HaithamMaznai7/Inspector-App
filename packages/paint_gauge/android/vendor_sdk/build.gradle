plugins {
    id 'com.android.library'
}

android {
    namespace "com.paintgauge.vendor.sdk"
    compileSdk 36

    defaultConfig {
        minSdk 24
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    // Use the extracted JAR instead of AAR
    api files('libs/sdk-release.jar')
}